<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seventh Path: Habit Tracker</title>
    <meta name="description" content="A beautiful habit tracking app with notification reminders to help you build consistent habits." />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#D6E7FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Seventh Path" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Service Worker Registration -->
    <script>
      // Only register service worker in production or if explicitly enabled
      const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const enableSWInDev = false; // Set to true to test SW in development
      
      if ('serviceWorker' in navigator && (!isDev || enableSWInDev)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
              // Update service worker if available
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('New service worker available, refreshing...');
                      window.location.reload();
                    }
                  });
                }
              });
            })
            .catch((error) => {
              console.warn('SW registration failed:', error);
            });
        });
      } else if (isDev) {
        console.log('Service Worker disabled in development mode');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
