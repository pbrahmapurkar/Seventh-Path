<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seventh Path: Habit Tracker</title>
    <meta name="description" content="A beautiful habit tracking app with notification reminders to help you build consistent habits." />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#D6E7FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Seventh Path" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Service Worker Registration - DISABLED IN DEVELOPMENT -->
    <!-- Service worker is only needed for production PWA functionality -->
    <script>
      // Unregister any existing service workers in development
      if ('serviceWorker' in navigator) {
        const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        
        if (isDev) {
          // Unregister all service workers in development
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              registration.unregister();
              console.log('🧹 Unregistered service worker:', registration.scope);
            }
          });
          console.log('🔧 Development mode: Service workers disabled');
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
